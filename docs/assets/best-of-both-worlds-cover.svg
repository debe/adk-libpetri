<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="cover-title">
  <title id="cover-title">adk-libpetri: stock ADK surfaces joined to a libpetri net through PetriAgent (a BaseAgent, Java and Python) and PetriWorkflow (a BaseNode, Python)</title>
  <!-- Intended display width: 720 px (scale 0.6; smallest text 19 px, about 11.4 px displayed).
       A dark card by design in both colour schemes. No colour-scheme media query: inside an img element
       the media query follows the OS, not the GitHub theme. -->
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .frame { stroke: #2c4168; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1124"/>
      <stop offset="1" stop-color="#0c1c3a"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#1b305e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0a1124" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cfeaff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="token" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102a4c"/>
      <stop offset="1" stop-color="#0a1d38"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="tokenGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fc6e8"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>
  <rect class="frame" x="8" y="8" width="1184" height="614" rx="18" fill="none" stroke-width="1.5"/>

  <!-- 'both worlds' venn behind the diagram -->
  <g>
    <circle cx="540" cy="388" r="150" fill="#38bdf8" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.30" stroke-width="1.5"/>
    <circle cx="660" cy="388" r="150" fill="#fbbf24" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.30" stroke-width="1.5"/>
  </g>

  <!-- central fusion seam -->
  <rect x="596" y="250" width="8" height="278" fill="url(#seam)" filter="url(#soft)"/>
  <rect x="599" y="252" width="2" height="274" fill="#e7f4ff" opacity="0.5"/>

  <!-- title -->
  <text x="600" y="98" text-anchor="middle" font-size="62" font-weight="700" fill="#f4f8ff" letter-spacing="0.5">The Best of Both Worlds</text>
  <text x="600" y="143" text-anchor="middle" font-size="23" font-weight="400" fill="#9fb6d8">A Coloured Time Petri-net orchestration core for Google's ADK (Java and Python)</text>

  <!-- section labels -->
  <text x="216" y="228" text-anchor="middle" font-size="19" font-weight="600" fill="#7dd3fc" letter-spacing="3">GOOGLE ADK</text>
  <text x="880" y="228" text-anchor="middle" font-size="19" font-weight="600" fill="#fcd34d" letter-spacing="3">LIBPETRI RUNTIME</text>

  <!-- left world: the ADK surfaces the net plugs into, unchanged -->
  <g stroke="#3aa0e0" stroke-opacity="0.30" stroke-width="1.5" fill="none">
    <path d="M384,264 C 404,264 400,379 420,379"/>
    <path d="M384,310 C 404,310 400,379 420,379"/>
    <path d="M384,356 C 404,356 400,379 420,379"/>
    <path d="M384,402 C 404,402 400,379 420,379"/>
    <path d="M384,448 C 404,448 400,379 420,379"/>
    <path d="M384,494 C 404,494 400,379 420,379"/>
  </g>
  <g class="chiptext" font-size="20" font-weight="600" fill="#cfe6fb" text-anchor="middle">
    <rect x="48" y="246" width="336" height="36" rx="10" fill="url(#chip)" stroke="#2f6ea8" stroke-width="1.5"/>
    <text x="216" y="271">Runner / InMemoryRunner</text>
    <rect x="48" y="292" width="336" height="36" rx="10" fill="url(#chip)" stroke="#2f6ea8" stroke-width="1.5"/>
    <text x="216" y="317">BaseSessionService</text>
    <rect x="48" y="338" width="336" height="36" rx="10" fill="url(#chip)" stroke="#2f6ea8" stroke-width="1.5"/>
    <text x="216" y="363">BaseTool</text>
    <rect x="48" y="384" width="336" height="36" rx="10" fill="url(#chip)" stroke="#2f6ea8" stroke-width="1.5"/>
    <text x="216" y="409">OpenTelemetry (EventStore)</text>
    <rect x="48" y="430" width="336" height="36" rx="10" fill="url(#chip)" stroke="#2f6ea8" stroke-width="1.5"/>
    <text x="216" y="455">Live / BIDI (LiveConnection)</text>
    <rect x="48" y="476" width="336" height="36" rx="10" fill="url(#chip)" stroke="#2f6ea8" stroke-width="1.5"/>
    <text x="216" y="501">Workflow graph (ADK 2, Python)</text>
  </g>
  <text x="216" y="540" text-anchor="middle" font-size="19" fill="#8aa2c4">stock ADK, unchanged</text>

  <!-- fusion connector with a token crossing the seam -->
  <path d="M420,379 C 560,379 540,386 733,386" fill="none" stroke="#fcd34d" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
  <path d="M420,379 C 560,379 540,386 733,386" fill="none" stroke="#fcd34d" stroke-opacity="0.55" stroke-width="2.5" marker-end="url(#arrowA)"/>
  <circle cx="600" cy="381" r="16" fill="url(#token)" filter="url(#tokenGlow)"/>
  <circle cx="600" cy="381" r="9.5" fill="url(#token)"/>

  <!-- right world: a Petri net -->
  <g stroke="#9fc6e8" stroke-width="2.6" fill="none">
    <line x1="787" y1="386" x2="838" y2="386" marker-end="url(#arrow)"/>
    <path d="M858,386 C 892,386 902,344 916,344" marker-end="url(#arrow)"/>
    <path d="M858,386 C 892,386 902,430 916,430" marker-end="url(#arrow)"/>
  </g>
  <!-- transition -->
  <rect x="840" y="346" width="16" height="80" rx="3" fill="#cfe0f2" stroke="#9fc6e8" stroke-width="1.5"/>
  <!-- places -->
  <circle cx="760" cy="386" r="27" fill="#0e1c34" stroke="#9fc6e8" stroke-width="2.6"/>
  <circle cx="946" cy="344" r="27" fill="#0e1c34" stroke="#9fc6e8" stroke-width="2.6"/>
  <circle cx="946" cy="430" r="27" fill="#0e1c34" stroke="#9fc6e8" stroke-width="2.6"/>
  <!-- token resting in the first place -->
  <circle cx="760" cy="386" r="11" fill="url(#token)"/>
  <text x="880" y="540" text-anchor="middle" font-size="19" fill="#8aa2c4">places · transitions · tokens</text>

  <!-- the seam -->
  <g class="mono" font-size="22" font-weight="600" fill="#fde68a" text-anchor="end">
    <text x="636" y="572">PetriAgent : BaseAgent</text>
    <text x="636" y="600">PetriWorkflow : BaseNode</text>
  </g>
  <g font-size="19" fill="#c9b37a">
    <text x="652" y="572">Java · Python</text>
    <text x="652" y="600">Python</text>
  </g>

  <!-- footer -->
  <text x="60" y="600" font-size="19" font-weight="700" fill="#8aa2c4" letter-spacing="0.5">adk-libpetri</text>
  <text x="1140" y="600" text-anchor="end" font-size="19" fill="#8aa2c4">an experiment, not a product</text>
</svg>
