name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Since libpetri 4.0 the SMT verifier runs a `z3` executable (4.8+, on
      # PATH or named by LIBPETRI_Z3) instead of loading JNI natives. Without
      # it every @EnabledIf("z3Available") suite skips SILENTLY, because a
      # JUnit skip is not a failure: the build stays green while the demo
      # nets' deadlock-freedom proofs never run. Z3NativeGateTest fails the
      # build if the binary is still missing, so this cannot regress quietly.
      - name: Install z3
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q z3
          z3 --version

      # REQUIRE_Z3 turns Z3NativeGateTest from a no-op into a hard gate: if the
      # step above silently stops working, the build fails here instead of
      # going green with the verification suite skipped.
      - run: ./mvnw verify
        env:
          REQUIRE_Z3: '1'

      # Javadoc runs with doclint (all but `missing`) and failOnWarnings, as
      # configured in the pom. Without this step a broken {@link} or bad
      # HTML surfaced only at release time, inside -Prelease.
      - name: Javadoc
        run: ./mvnw -B -q javadoc:javadoc

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # Same gate as the Java job: without z3 every requires_z3 test skips
      # silently. REQUIRE_Z3 makes tests/test_z3_gate.py fail instead.
      - name: Install z3
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q z3
          z3 --version

      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      # tests/conformance golden-checks every stock subnet against the Java
      # nets in spec/fixtures/nets, which the Java job golden-checks too.
      - run: pytest
        env:
          REQUIRE_Z3: '1'
