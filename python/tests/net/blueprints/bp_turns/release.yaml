# Java Marvin's shape: the permit comes back, and the turn is released, when
# the response forks; the delivery tail (a slow guard, then the final frame)
# runs after the release (ADR 0010).
agent_class: adk_libpetri.net.PetriNet
name: release
nodes:
  - [.agent.shout]
  - [.agent.guard]
places:
  permit: {seed: 1}
  answer: {type: str}
  draft: {type: str}
  guarded: {type: str}
  turnReleased: {}
turn:
  release: turnReleased
transitions:
  Rel_Respond: {in: [userIn, permit], out: answer, node: shout}
  Rel_Fork: {in: [answer], out: {and: [draft, turnReleased, permit]}}
  Rel_Guard: {in: [draft], out: guarded, node: guard}
  Rel_Final: {in: [guarded], out: eventOut, action: emit}
prove:
  options: {sinks: [eventOut, permit, turnReleased]}
  claims: [deadlock_free, {place_bound: {place: permit, bound: 1}}]
